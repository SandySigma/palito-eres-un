<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pregunta importante</title>
    <script>
        const posiciones = []; // para guardar posiciones usadas

        function generarPosicion() {
            let x, y;
            let intento = 0;
            do {
                x = Math.random() * 90; // porcentaje ancho
                y = Math.random() * 90; // porcentaje alto
                intento++;
                // revisa que no esté cerca de otra posición
            } while (posiciones.some(p => Math.abs(p.x - x) < 5 && Math.abs(p.y - y) < 5) && intento < 50);
            
            posiciones.push({x, y});
            return {x, y};
        }

        function responder(respuesta) {
            if (respuesta === "si") {
                alert("Preparando respuesta...");

                // Cambios de color rápido
                setInterval(() => {
                    document.body.style.backgroundColor =
                        "#" + Math.floor(Math.random()*16777215).toString(16);
                }, 50);

                // Genera textos “| palito puto nigga |” sin superposición
                setInterval(() => {
                    let pos = generarPosicion();
                    let div = document.createElement("div");
                    div.innerText = "palito puto nigga";
                    div.style.position = "absolute";
                    div.style.left = pos.x + "%";
                    div.style.top = pos.y + "%";
                    div.style.fontSize = (Math.random()*20 + 15) + "px";
                    div.style.fontWeight = "bold";
                    document.body.appendChild(div);
                }, 100);

                // Movimiento leve de toda la página
                setInterval(() => {
                    document.body.style.transform =
                        "translate(" + (Math.random()*10-5) + "px," + (Math.random()*10-5) + "px)";
                }, 50);

            } else {
                document.body.innerHTML = "<h1>Tonto</h1>";
            }
        }
    </script>
</head>
<body style="text-align:center; margin-top:100px; font-family:sans-serif;">

    <h1>¿Eres gay?</h1>

    <button onclick="responder('si')" style="font-size:20px;">
        Sí
    </button>

    <button onclick="responder('no')" style="font-size:20px;">
        No
    </button>

</body>
</html>
